{% extends "public/base.html" %}

{% block title %}Password Reset Complete | {{ settings.site_name }}{% endblock %}

{% block content %}
<section style="padding: 120px 20px; background: #F9F6F0; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 50px 40px; border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center;">
        <i class="fa-solid fa-check-circle" style="font-size: 48px; color: #166534; margin-bottom: 20px;"></i>
        <h1 style="font-family: var(--font-heading); color: var(--brand-green); font-size: 24px; margin-bottom: 12px;">Password Reset Successful</h1>
        <p style="color: var(--text-light); font-size: 15px; margin-bottom: 30px;">Your password has been set. You may go ahead and log in now.</p>
        <a href="{% url 'public_login' %}" class="btn btn-primary" style="padding: 12px 30px; font-size: 16px;">Sign In</a>
    </div>
</section>
{% endblock %}
