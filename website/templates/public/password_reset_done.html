{% extends "public/base.html" %}

{% block title %}Email Sent | {{ settings.site_name }}{% endblock %}

{% block content %}
<section style="padding: 120px 20px; background: #F9F6F0; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 50px 40px; border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center;">
        <i class="fa-solid fa-envelope-circle-check" style="font-size: 48px; color: var(--brand-green); margin-bottom: 20px;"></i>
        <h1 style="font-family: var(--font-heading); color: var(--brand-green); font-size: 24px; margin-bottom: 12px;">Check Your Email</h1>
        <p style="color: var(--text-light); font-size: 15px; margin-bottom: 0;">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
    </div>
</section>
{% endblock %}
