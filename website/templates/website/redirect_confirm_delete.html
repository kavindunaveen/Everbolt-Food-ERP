{% extends 'layouts/base.html' %}
{% block title %}Delete SEO Redirect{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="bg-red-50 px-6 py-5 border-b border-red-100">
            <h3 class="text-lg font-bold text-red-800">Confirm Deletion</h3>
        </div>
        <div class="p-6 text-center">
            <p class="text-gray-600 mb-6">Are you sure you want to delete the SEO redirect for <strong>{{ object.old_path }}</strong>? This action cannot be undone.</p>
            <form method="post" class="flex justify-center gap-3">
                {% csrf_token %}
                <a href="{% url 'website_redirect_list' %}" class="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Cancel</a>
                <button type="submit" class="px-5 py-2.5 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors shadow-lg shadow-red-200">Yes, Delete Redirect</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
